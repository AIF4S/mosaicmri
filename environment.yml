name: humusnet_env
channels:
  - pytorch
  - conda-forge
  - defaults

dependencies:
  # ---- Core Python version (required for old h5py & numpy) ----
  - python=3.8
  - pip
  - cudatoolkit=11.1           # Works with PyTorch 1.8–1.9 and fastMRI 0.1.1
  - intel-openmp=2021.4.0      # Ensures libittnotify symbols required by libtorch_cpu

  # ---- PyTorch compatible with CUDA 11.1 ----
  - pytorch=1.9.0
  - torchvision=0.10.0
  - torchaudio=0.9.0

  # ---- Conda packages you want fixed at specific versions ----
  - h5py=2.10.0
  - pyyaml=5.3.1
  - numpy=1.18.5

  # ---- Everything else handled via pip ----
  - pip:
      - runstats==1.8.0
      - pyxb==1.2.6
      - xmltodict
      - einops==0.3.0
      - fastmri==0.1.1
      - timm==0.4.12
      - torchmetrics==0.7.3
